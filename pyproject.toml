[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blind_watermark"
version = "0.4.4"
description = "Blind Watermark in Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Guo Fei", email = "guofei9987@foxmail.com"},
]
keywords = ["watermark", "blind-watermark", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.17.0",
    "opencv-python",
    "PyWavelets",
]

[project.urls]
Homepage = "https://github.com/YC-CLT/blind_watermark"
Repository = "https://github.com/YC-CLT/blind_watermark"

[project.scripts]
blind_watermark = "blind_watermark.cli_tools:main"

[tool.hatch.build.targets.wheel]
packages = ["blind_watermark"]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]